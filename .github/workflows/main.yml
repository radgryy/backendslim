name: Build and Push Slim Open WebUI to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Pozwala na ręczne uruchomienie budowania z zakładki Actions

env:
  REGISTRY: ghcr.io
  # Nazwa repozytorium w małych literach (np. ghcr.io/twoj-username/open-webui-slim)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            # Jeśli pushujesz do main, automatycznie doda tag :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # Przekazanie hash builda do Twojego Dockerfile
          build-args: |
            BUILD_HASH=${{ github.sha }}
          # Wykorzystanie cache GitHub Actions, aby drastycznie przyspieszyć kolejne buildy
          cache-from: type=gha
          cache-to: type=gha,mode=max
